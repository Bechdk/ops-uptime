name: Uptime

on:
  schedule:
    # Off the full hour, where GitHub delays scheduled runs the most.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    name: Check /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health endpoint up to 3 times
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::The HEALTH_URL secret is not set"
            exit 1
          fi
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH_URL" || true)
            if [ "${status:0:1}" = "2" ]; then
              echo "OK: status $status on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed with status $status"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "::error::The health endpoint failed 3 times in a row"
          exit 1
